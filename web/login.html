<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Audit App</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <form class="auth-card" id="login-page-form">
      <h1 data-auth-brand-title>Audit App</h1>
      <h2>Login</h2>
      <label>Email or username<input name="identifier" autocomplete="username" placeholder="email@example.com or username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <label class="inline-check"><input name="remember" type="checkbox"> Remember me</label>
      <p class="form-message" data-auth-page-message></p>
      <button class="primary" type="submit">Login</button>
      <a class="button-link outline" href="/register.html">Register Account</a>
      <button class="plain-link" type="button" data-page-forgot-password>Forgot password</button>
    </form>
  </main>
  <script src="js/auth-pages.js"></script>
</body>
</html>
