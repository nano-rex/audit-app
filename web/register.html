<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Ottotree Audit</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <form class="auth-card" id="register-page-form">
      <h1 data-auth-brand-title>Ottotree Audit</h1>
      <h2>Register Account</h2>
      <label>Name<input name="name" autocomplete="name" required></label>
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Confirm Password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
      <p class="form-message" data-auth-page-message></p>
      <button class="primary" type="submit">Register</button>
      <a class="button-link outline" href="/login.html">Back to Login</a>
    </form>
  </main>
  <script src="js/auth-pages.js"></script>
</body>
</html>
