  <dialog id="captain">
    <form method="dialog" id="captain-form">
      <header><h2>Captain Login</h2><button value="cancel">x</button></header>
      <label>Select Outlet<select name="outlet"><option>-- Choose outlet --</option></select></label>
      <label>Enter PIN Code<input type="password" placeholder="PIN code"></label>
      <aside class="guide">
        <b>PIN Guide</b>
        <span>Use the outlet captain PIN assigned for the selected outlet.</span>
      </aside>
      <label>Your Name<input name="captainName" placeholder="Enter your name..."></label>
      <button class="purple" value="default">Login</button>
    </form>
  </dialog>
