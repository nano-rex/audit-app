  <dialog id="user-dialog">
    <form method="dialog" id="user-form">
      <header><h2>User Setup</h2><button type="button" data-close-dialog>x</button></header>
      <input name="userId" type="hidden">
      <nav class="sub-tabs" aria-label="User editor">
        <button type="button" data-editor-tab="details">Details</button>
        <button type="button" data-editor-tab="permissions">Permissions</button>
      </nav>
      <section data-editor-panel="details">
      <div class="form-grid">
        <label>Name<input name="name" placeholder="User name"></label>
        <label>Email<input name="email" type="email" placeholder="name@example.com"></label>
        <label>Role<select name="role"></select></label>
        <label>Department<select name="department"></select></label>
        <label>Title<input name="title" placeholder="Job title"></label>
        <label>Password<input name="password" type="password" autocomplete="new-password" placeholder="Leave blank unless setting/resetting"></label>
      </div>
      <label>Responsibilities<textarea name="responsibilities" placeholder="Main responsibilities or ownership"></textarea></label>
      <label class="inline-check"><input name="active" type="checkbox" checked> Active user</label>
      <label class="inline-check"><input name="resetRequired" type="checkbox"> Require password change on next login</label>
      <label class="inline-check"><input name="resetPassword" type="checkbox"> Reset password to the value entered above</label>
      </section>
      <section data-editor-panel="permissions" hidden>
        <label class="inline-check"><input name="inheritPermissions" type="checkbox" checked> Inherit permissions from role</label>
        <p>Turn off inheritance to set permissions for this user. Turning it back on restores the role permissions.</p>
        <h3>Tab Access</h3>
        <div data-user-permissions></div>
        <h3>Inspection Permissions</h3>
        <div data-user-inspection-permissions></div>
      </section>
      <p data-user-form-message role="alert"></p>
      <button class="primary" type="submit" value="default">Save User</button>
    </form>
  </dialog>
