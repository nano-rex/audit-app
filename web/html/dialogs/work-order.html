  <dialog id="work-order-dialog">
    <form method="dialog" id="work-order-form">
      <header><h2>Create Work Order</h2><button type="button" data-close-dialog>x</button></header>
      <input name="workOrderId" type="hidden">
      <div class="form-grid">
        <label data-work-order-only>Outlet<select name="outlet"></select></label>
        <label data-work-order-only>Location<select name="zone"></select></label>
        <label>Department<select name="requestType"></select></label>
        <label>Category<select name="category"></select></label>
        <label>Priority<select name="priority"></select></label>
        <label data-work-order-only>Status<select name="status"></select></label>
        <label data-work-order-only>Assignee<input name="assignee" placeholder="Technical Support"></label>
        <label>PIC<input name="pic" placeholder="Person in charge"></label>
        <label data-work-order-only>Due Date<input name="dueDate" type="date"></label>
        <label data-work-order-only>Vendor<input name="vendor" placeholder="Internal or external vendor"></label>
        <label data-work-order-only>SLA Status<select name="slaStatus"><option value="">Auto</option><option>On Track</option><option>Due Soon</option><option>Overdue</option><option>Completed</option></select></label>
        <label data-work-order-only>Cost<input name="cost" type="number" min="0" step="0.01" placeholder="0.00"></label>
      </div>
      <label data-work-order-only>Issue Title<input name="title" placeholder="What needs follow-up?"></label>
      <label>Description<textarea name="description" placeholder="Troubleshooting detail, photo note, or outlet confirmation needed"></textarea></label>
      <label>Cause<textarea name="cause" placeholder="Known or suspected cause"></textarea></label>
      <label>Recommendation<textarea name="recommendation" placeholder="Suggested correction"></textarea></label>
      <label>Required Action<textarea name="requiredAction" placeholder="Work required to resolve the issue"></textarea></label>
      <label>Finding Photos<input type="file" accept="image/*" multiple capture="environment" data-work-order-evidence-upload></label>
      <div data-work-order-evidence data-saved-images></div>
      <section class="form-section" data-corrective-fields>
        <h3>Corrective Action</h3>
        <div class="form-grid">
          <label>Completion Date<input name="completionDate" type="date"></label>
        </div>
        <label>Action Taken<textarea name="actionTaken" placeholder="Describe what was repaired, replaced, cleaned, adjusted, or verified"></textarea></label>
        <label>Completion Remark<textarea name="completionRemark" placeholder="Final note, confirmation detail, or pending condition"></textarea></label>
        <label>Completion Photo<input type="file" accept="image/*" multiple capture="environment" data-work-order-completion-photo></label>
        <div class="saved-images" data-work-order-completion-photos></div>
      </section>
      <section class="form-section" data-verification-fields>
        <h3>Verification</h3>
        <div class="form-grid">
          <label>Verified By<input name="verifiedBy" readonly placeholder="Recorded when verified"></label>
          <label>Verified Date<input name="verifiedAt" type="date" readonly></label>
          <label>Closed Date<input name="closedAt" type="date" readonly></label>
        </div>
        <label>Verification Remark<textarea name="verificationRemark" placeholder="Acceptance note, rejection reason, or close-out comment"></textarea></label>
        <p class="muted">A verifier accepts completed work by choosing Verified or Closed, or returns it by choosing In Progress with a remark.</p>
      </section>
      <section class="form-section" data-work-order-comments-section hidden>
        <h3>Comments Timeline</h3>
        <div class="list compact-list" data-work-order-comments></div>
        <label>Add Comment<textarea name="timelineComment" placeholder="Add a follow-up note"></textarea></label>
        <button class="outline" type="button" data-add-work-order-comment>Add Comment</button>
      </section>
      <p class="muted" data-work-order-stage-hint role="status"></p>
      <p class="form-message" data-work-order-message role="alert"></p>
      <button class="primary" type="submit" value="default">Save Work Order</button>
    </form>
  </dialog>
