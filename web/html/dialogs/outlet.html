  <dialog id="outlet-dialog">
    <form method="dialog" id="outlet-form">
      <header><h2>Outlet Setup</h2><button type="button" data-close-dialog>x</button></header>
      <input name="outletId" type="hidden">
      <div class="form-grid">
        <label>Outlet Code<input name="code" placeholder="Outlet code"></label>
        <label>Location<input name="location" placeholder="Mall, branch, city, or floor"></label>
      </div>
      <label>Description<textarea name="description" placeholder="Outlet description or operating note"></textarea></label>
      <button class="primary" type="submit" value="default">Save Outlet</button>
    </form>
  </dialog>
