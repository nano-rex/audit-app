  <dialog id="department-dialog">
    <form method="dialog" id="department-form">
      <header><h2>Department Setup</h2><button type="button" data-close-dialog>x</button></header>
      <input name="departmentId" type="hidden">
      <div class="form-grid">
        <label>Department Code<input name="code" placeholder="Department code"></label>
        <label>Description<input name="description" placeholder="Department name or description"></label>
      </div>
      <label>Responsibilities<textarea name="responsibilities" placeholder="What this department handles"></textarea></label>
      <button class="primary" value="default">Save Department</button>
    </form>
  </dialog>
