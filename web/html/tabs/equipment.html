    <section id="equipment" class="tab-panel">
      <section class="panel list-panel">
        <header class="panel-head">
          <h2 data-equipment-title>Fixed Assets</h2>
          <div class="panel-actions">
            <button class="primary" type="button" data-open-equipment="asset" data-show-kind="asset">Add Fixed Asset</button>
            <button class="primary" type="button" data-open-equipment="fixture" data-show-kind="fixture">Add Fixture or Finish</button>
          </div>
        </header>
        <div class="filter">
          <label>Search<input id="equipment-search" placeholder="Search"></label>
          <label>Category<select id="equipment-filter-category"><option value="">All categories</option></select></label>
          <label>Outlet<select id="equipment-filter-outlet"></select></label>
          <label>Location<select id="equipment-filter-location"></select></label>
          <label data-show-kind="asset">Type<select id="equipment-filter-type"><option value="">All types</option></select></label>
          <label data-show-kind="asset">Brand<select id="equipment-filter-brand"><option value="">All brands</option></select></label>
        </div>
        <p class="muted" data-show-kind="asset">Fixed assets are equipment with a code and serial details, such as TVs, chillers, and air conditioners.</p>
        <p class="muted" data-show-kind="fixture" hidden>Fixtures and finishes are parts of the building itself, such as wall paint, floor tiles, pipes, toilets, and sinks. They are inspected like fixed assets.</p>
        <div class="list compact-list" data-equipment></div>
      </section>
    </section>
