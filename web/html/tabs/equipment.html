    <section id="equipment" class="tab-panel">
      <section class="panel filter">
        <header class="panel-head">
          <h2>Asset Register</h2>
          <div class="panel-actions">
            <button class="primary" type="button" data-open-equipment="asset">Add Fixed Asset</button>
            <button class="primary" type="button" data-open-equipment="fixture">Add Fixture or Finish</button>
          </div>
        </header>
        <label>Search<input id="equipment-search" placeholder="Search assets, fixtures, and finishes"></label>
        <label>Show<select id="equipment-filter-kind"><option value="">Everything</option><option value="asset">Fixed assets</option><option value="fixture">Fixtures &amp; finishes</option></select></label>
        <label>Category<select id="equipment-filter-category"><option value="">All categories</option></select></label>
        <label>Outlet<select id="equipment-filter-outlet"></select></label>
        <label>Location<select id="equipment-filter-location"></select></label>
        <label>Type<select id="equipment-filter-type"><option value="">All types</option></select></label>
        <label>Brand<select id="equipment-filter-brand"><option value="">All brands</option></select></label>
      </section>
      <section class="work-grid">
        <article class="panel">
          <h2>Fixed Assets, Fixtures &amp; Finishes</h2>
          <p class="muted">Fixed assets are equipment with a code and serial details. Fixtures and finishes are parts of the building itself, such as wall paint, floor tiles, pipes, toilets, and sinks. Both are inspected.</p>
          <div class="list compact-list" data-equipment></div>
        </article>
      </section>
    </section>
