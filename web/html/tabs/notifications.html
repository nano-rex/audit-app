    <section id="notifications" class="tab-panel">
      <section class="panel list-panel">
        <header class="panel-head">
          <h2>Notifications</h2>
          <div class="panel-actions">
            <button class="outline" type="button" data-refresh-notifications>Refresh</button>
            <button class="outline" type="button" data-read-all-notifications>Mark all read</button>
          </div>
        </header>
        <div class="filter">
          <label>Search<input id="notification-search" placeholder="Search notifications"></label>
          <label>Status<select id="notification-filter-status"><option value="">All statuses</option><option>Unread</option><option>Read</option></select></label>
        </div>
        <div class="list compact-list" data-notifications></div>
      </section>
    </section>
