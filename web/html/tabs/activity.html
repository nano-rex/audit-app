    <section id="activity" class="tab-panel">
      <section class="panel list-panel">
        <header class="panel-head">
          <h2>Activity Log</h2>
        </header>
        <p class="muted">Every audit, sign-off, work request, work order, and change, newest first.</p>
        <form class="filter" data-activity-filter>
          <label>From<input type="date" name="from"></label>
          <label>To<input type="date" name="to"></label>
          <label>Outlet<select name="activityOutlet"><option value="">All outlets</option></select></label>
          <label>Person<select data-activity-person><option value="">Everyone</option></select></label>
          <label>Search<input type="search" data-activity-search placeholder="Action, record, or detail"></label>
        </form>
        <p class="muted" data-activity-total></p>
        <div class="list compact-list" data-activity-log></div>
      </section>
    </section>
