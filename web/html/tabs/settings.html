    <section id="settings" class="tab-panel">
      <section class="work-grid settings-grid">
        <article class="panel">
          <h2>Priority Levels</h2>
          <form id="priority-form" class="inline-form">
            <input name="priorityId" type="hidden">
            <label>Name<input name="name" placeholder="Priority"></label>
            <label>Classification<select name="classification"><option>Priority</option><option>Non-Priority</option></select></label>
            <label>Due Days<input name="dueDays" type="number" min="0" value="3"></label>
            <label class="checkbox-line"><input name="active" type="checkbox" checked> Active</label>
            <button class="primary" type="submit">Save Priority</button>
          </form>
          <div class="list compact-list" data-priority-records></div>
        </article>
        <article class="panel">
          <h2>Audit Types</h2>
          <form id="audit-type-form" class="inline-form">
            <input name="auditTypeId" type="hidden">
            <label>Name<input name="name" placeholder="Routine Audit"></label>
            <label>Description<textarea name="description" placeholder="When this audit type is used"></textarea></label>
            <label class="checkbox-line"><input name="active" type="checkbox" checked> Active</label>
            <button class="primary" type="submit">Save Audit Type</button>
          </form>
          <div class="list compact-list" data-audit-type-records></div>
        </article>
        <article class="panel">
          <h2>Scoring</h2>
          <form id="scoring-settings-form" class="inline-form">
            <label>Pass Mark<input name="passMark" type="number" min="0" max="100"></label>
            <label>Weighting Mode<select name="weightingMode"><option>Equal</option><option>Weighted</option></select></label>
            <label>Excellent From<input name="excellentFrom" type="number" min="0" max="100"></label>
            <label>Good From<input name="goodFrom" type="number" min="0" max="100"></label>
            <label>Needs Improvement From<input name="needsImprovementFrom" type="number" min="0" max="100"></label>
            <button class="primary" type="submit">Save Scoring</button>
          </form>
        </article>
        <article class="panel">
          <h2>Report & System</h2>
          <form id="system-settings-form" class="inline-form">
            <label>Company Name<input name="companyName"></label>
            <label>Department Header<input name="departmentHeader"></label>
            <label>Logo URL<input name="logoUrl" placeholder="Optional report logo"></label>
            <label>Notification Channels<input name="channels" placeholder="In-App, Email, WhatsApp, Push"></label>
            <label>Future Integrations<textarea name="integrations" placeholder="CMMS, vendor portal, AI summary, AI defect detection"></textarea></label>
            <button class="primary" type="submit">Save Settings</button>
          </form>
        </article>
      </section>
    </section>
