    <section id="account" class="tab-panel">
      <article class="panel account-panel">
        <h2>Account</h2>
        <form id="account-form">
          <div class="account-photo-row">
            <img data-account-photo alt="Your profile picture" hidden>
            <div>
              <label>Profile picture<input type="file" accept="image/png,image/jpeg,image/webp" data-account-photo-upload></label>
              <button type="button" class="outline" data-remove-account-photo>Remove picture</button>
            </div>
          </div>
          <div class="form-grid">
            <label>Name<input name="name" autocomplete="name" required maxlength="100"></label>
            <label>Username<input name="username" autocomplete="username" required pattern="[a-z0-9][a-z0-9._-]{2,63}"></label>
            <label>Email<input name="email" type="email" autocomplete="email" required></label>
            <label>Department<select name="department"></select></label>
            <label>Role<select name="role"></select></label>
          </div>
          <section class="account-signature">
            <h3>Your Signature</h3>
            <img data-account-signature alt="Your saved signature" hidden>
            <label>Upload signature image<input type="file" accept="image/png,image/jpeg,image/webp" data-account-signature-upload></label>
            <button type="button" class="outline" data-remove-account-signature>Remove signature</button>
            <p>This image will be available when you sign an inspection.</p>
          </section>
          <p class="muted" data-account-access-note hidden>Your role and department are managed by an administrator.</p>
          <p role="status" aria-live="polite" data-account-message></p>
          <button class="primary" type="submit">Save Account</button>
        </form>
      </article>
      <article class="panel account-panel">
        <h2>Security</h2>
        <div class="quick-actions">
          <button class="outline" type="button" data-open-change-password>Change Password</button>
          <button class="outline" type="button" data-logout>Logout</button>
        </div>
      </article>
      <article class="panel account-panel" data-database-management hidden>
        <h2>Company databases</h2>
        <p class="muted">Super users can switch the active company database or create a new empty company database.</p>
        <div class="form-grid">
          <label>Active database<select data-database-select></select></label>
          <label>New database name<input data-new-database-name pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,63}" placeholder="company_name"></label>
        </div>
        <div class="form-actions">
          <button class="outline" type="button" data-refresh-databases>Refresh</button>
          <button class="outline" type="button" data-create-database>Create Database</button>
          <button class="primary" type="button" data-switch-database>Switch Database</button>
          <button class="danger" type="button" data-remove-database>Remove Selected</button>
        </div>
        <p role="status" aria-live="polite" data-database-message></p>
      </article>
    </section>
