    <section id="findings" class="tab-panel">
      <!-- include: html/tabs/inspection-history.html -->
      <section data-history-findings-panel="findings" hidden>
      <section class="panel list-panel">
        <header class="panel-head">
          <h2>Findings</h2>
          <div class="panel-actions">
            <span data-finding-inspection-scope>All inspections</span>
            <button type="button" class="outline" data-all-inspection-findings>Show All Inspections</button>
          </div>
        </header>
        <div class="filter">
          <label>Search<input id="finding-search" placeholder="Search findings"></label>
          <label>Outlet<select id="finding-filter-outlet"></select></label>
          <label>Location<select id="finding-filter-location"><option value="">All locations</option></select></label>
          <label>Department<select id="finding-filter-department"></select></label>
          <label>Category<select id="finding-filter-category"></select></label>
          <label>Priority<select id="finding-filter-priority"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></label>
          <label>Status<select id="finding-filter-status"><option value="active" selected>Not closed</option><option value="">All statuses</option><option>Open</option><option>Requested</option><option>Assigned</option><option>In Progress</option><option>Pending</option><option>Closed</option></select></label>
        </div>
        <p class="muted">Each item that failed a check is listed once. Create a work request to have it fixed; the request goes to Maintenance.</p>
        <p class="form-message success" data-findings-message role="status"></p>
        <div class="list compact-list" data-findings></div>
      </section>
      </section>
    </section>
