    <section id="inspections" class="tab-panel">
      <div class="sub-tabs">
        <button class="active" type="button" data-inspection-subtab="guided">Guided Inspection</button>
      </div>
      <section class="inspection-subpanel active" data-inspection-panel="guided">
        <section class="panel" data-guided-schedules-panel>
          <h2>Scheduled Work</h2>
          <p>Select a schedule to start or resume its guided inspection.</p>
          <button type="button" class="primary" data-open="schedule">Schedule Work</button>
          <div class="list" data-guided-schedules></div>
        </section>
        <section class="inspect-layout" data-guided-content hidden>
          <form class="panel inspection-form" id="inspection-form">
            <h2>Guided Inspection</h2>
            <input name="inspectionSessionId" type="hidden">
            <div data-current-schedule></div>
            <div class="inspection-name-display" data-current-inspection-name>New inspection</div>
            <div class="form-grid">
              <label>Outlet<select name="outlet"></select></label>
              <label>Auditor<input name="auditor" readonly placeholder="Signed-in account"></label>
              <label>Inspection Date<input name="auditDate" type="date"></label>
            </div>
            <div class="progress-strip">
              <span data-inspection-progress>0% complete</span>
              <progress value="0" max="100" data-inspection-progress-bar></progress>
            </div>
            <div class="zone-progress-list" data-inspection-zone-progress></div>
            <div class="checklist" data-checklist></div>
            <section class="signature-strip">
              <button class="outline" type="button" data-open-signature="auditedBy">Audited By</button>
              <button class="outline" type="button" data-open-signature="verifiedBy">Verified By</button>
              <button class="outline" type="button" data-open-signature="acknowledgedBy">Acknowledged By</button>
              <button class="outline" type="button" data-save-inspection-signatures>Save Signatures</button>
              <div data-signature-status></div>
            </section>
            <footer class="form-actions">
              <button class="outline" type="button" data-back-to-schedules>Back to Scheduled Work</button>
              <a class="button-link outline disabled" data-export-inspection-pdf href="#">Export PDF</a>
              <button class="primary" type="button" data-save-inspection-progress>Save Progress</button>
            </footer>
          </form>
          <aside class="panel">
            <h2>Inspection Standard</h2>
            <div class="flow-list">
              <span><b>1</b> Open a scheduled inspection</span>
              <span><b>2</b> Work through each zone and location</span>
              <span><b>3</b> Mark every criterion tick or cross</span>
              <span><b>4</b> Record findings for failed checks</span>
            </div>
          </aside>
        </section>
      </section>
    </section>
