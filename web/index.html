    <div class="brand">
      <h1 data-brand-title>Audit App</h1>
      <p data-brand-subtitle>Facilities audit workspace</p>
    </div>
    <div class="account-strip" data-account-strip hidden>
      <span data-auth-user></span>
      <button class="outline" type="button" data-jump-tab="account">Account</button>
    </div>
    <div class="nav-row">
      <nav class="tabs" aria-label="Audit sections">
        <button class="active" data-tab="today">Dashboard</button>

        <button data-tab="findings">History &amp; Findings</button>

        <button data-tab="outlets">Outlets</button>
        <button data-tab="users">Users</button>
        <button data-tab="settings">Settings</button>
        <button data-tab="account">Account</button>
        <button data-tab="super-dashboard">Super Dashboard</button>
        <button data-tab="super-settings">Super Settings</button>
      </nav>
      <button class="menu-button" type="button" data-menu-toggle aria-expanded="false" aria-controls="tab-menu" aria-label="Open tab menu">☰</button>
      <div class="tab-menu" id="tab-menu" hidden>
        <h2>Pages</h2>
        <p>Move pages up or down. The first pages appear on the bar as space allows.</p>
        <p data-navigation-status role="status" aria-live="polite"></p>
        <div data-menu-tabs></div>
      </div>
    </div>
  </header>
